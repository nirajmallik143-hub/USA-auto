name: Daily USA Kids Videos

on:
  workflow_dispatch:
    inputs:
      video_count:
        description: "Max number of videos to produce (empty = all of today's slots)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (do not upload to YouTube)"
        type: boolean
        default: true

concurrency:
  group: daily-videos
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  run-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DRY_RUN_UPLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
      DB_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'pipeline_dryrun.db' || 'pipeline.db' }}
      DATABASE_URL: sqlite:///output/${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'pipeline_dryrun.db' || 'pipeline.db' }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'procedural' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      TTS_ENGINE: gtts
      COPPA_MADE_FOR_KIDS: "true"
      YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps: 
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Write YouTube credentials
        if: env.DRY_RUN_UPLOAD != 'true'
        run: python scripts/write_credentials.py

      - name: Restore pipeline state
        uses: actions/cache/restore@v4
        with:
          path: output/${{ env.DB_NAME }}*
          key: pipeline-state-${{ env.DB_NAME }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pipeline-state-${{ env.DB_NAME }}-

      - name: Preflight (doctor)
        shell: bash
        run: |
          mkdir -p logs
          python -m src.cli doctor 2>&1 | tee logs/doctor.txt

      - name: Run daily batch
        id: daily
        continue-on-error: true
        env:
          VIDEO_COUNT: ${{ inputs.video_count }}
        run: python -m src.cli run-daily ${VIDEO_COUNT:+--count "$VIDEO_COUNT"}

      - name: Retry failed jobs
        id: retry
        continue-on-error: true
        run: python -m src.cli retry-failed --force

      - name: Verify results
        run: python -m src.cli status --check --summary-file logs/failure_summary.md

      - name: Save pipeline state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: output/${{ env.DB_NAME }}*
          key: pipeline-state-${{ env.DB_NAME }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            logs/
            output/pipeline*.db
          if-no-files-found: ignore

      - name: Open or update failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (p) => fs.existsSync(p) ? fs.readFileSync(p, 'utf8') : '';
            const summary = read('logs/failure_summary.md');
            const doctor = read('logs/doctor.txt').split('\n').slice(-30).join('\n');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Run: ${runUrl}`,
              '',
              '### Job error summary',
              summary || '_No job summary available (a step failed before jobs were evaluated)._',
              '',
              '### Preflight output',
              '```',
              doctor || '(none)',
              '```',
            ].join('\n');
            const title = 'Daily video workflow failed';
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'automation-failure',
            });
            const existing = issues.find((i) => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['automation-failure'] });
            }

      - name: Notify Telegram (optional)
        if: failure() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=Daily video workflow failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > /dev/null
