name: Daily USA Kids Videos

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC = 7:00 AM US Eastern
  workflow_dispatch:         # manual "Run workflow" button
    inputs:
      dry_run:
        description: "Simulate uploads instead of posting to YouTube"
        type: boolean
        default: false

concurrency:
  group: daily-videos
  cancel-in-progress: false

jobs:
  run-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'template' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      TTS_ENGINE: gtts
      COPPA_MADE_FOR_KIDS: "true"
      YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS || 'scheduled' }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
      # Live uploads by default once YOUTUBE_TOKEN_JSON exists; manual runs can opt into a dry run.
      YOUTUBE_DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) || secrets.YOUTUBE_TOKEN_JSON == '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python deps
        run: pip install -r requirements.txt

      # Keeps the job queue/history between runs so failed uploads retry and topics don't repeat.
      - name: Restore pipeline state
        uses: actions/cache/restore@v4
        with:
          path: output/pipeline.db
          key: pipeline-db-${{ github.run_id }}
          restore-keys: pipeline-db-

      - name: Verify YouTube credentials
        if: env.YOUTUBE_DRY_RUN == 'false'
        run: python -m src.cli youtube-check

      - name: Warn when running in dry-run mode
        if: env.YOUTUBE_DRY_RUN == 'true'
        run: echo "::warning::Uploads are simulated. Add the YOUTUBE_TOKEN_JSON secret to publish to YouTube."

      - name: Run daily batch
        run: python -m src.cli run-daily

      - name: Save pipeline state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: output/pipeline.db
          key: pipeline-db-${{ github.run_id }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: |
            logs/
            output/pipeline.db
          if-no-files-found: ignore
