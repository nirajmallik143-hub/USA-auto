services:
  # Redis message broker and result backend for Celery
  redis:
    image: redis:7-alpine
    container_name: usa_kids_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Celery Worker for asynchronous video generation and YouTube publishing
  celery_worker:
    build: .
    container_name: usa_kids_celery_worker
    command: celery -A src.scheduler.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=sqlite:////app/data/pipeline.db
    volumes:
      - app_data:/app/data
      - app_output:/app/output
      - app_logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Celery Beat periodic scheduler triggering 7 daily video slots
  celery_beat:
    build: .
    container_name: usa_kids_celery_beat
    command: celery -A src.scheduler.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=sqlite:////app/data/pipeline.db
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Standalone APScheduler runner (Alternative to Celery, enabled via profile)
  standalone_scheduler:
    build: .
    container_name: usa_kids_apscheduler
    command: python -m src.scheduler.cron_runner
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/pipeline.db
    volumes:
      - app_data:/app/data
      - app_output:/app/output
      - app_logs:/app/logs
    restart: unless-stopped
    profiles:
      - standalone

volumes:
  redis_data:
  app_data:
  app_output:
  app_logs:
